name: cech-umap
channels:
  - pytorch
  - conda-forge

dependencies:
  # --- core language / numerics ---
  - python=3.11
  - numpy
  - scipy

  # --- torch stack ---
  - pytorch
  - torchvision

  # --- scientific / ML stack for experiments ---
  - scikit-learn
  - umap-learn
  - matplotlib
  - pandas
  - anndata
  - scanpy
  - ripser
  - persim
  - pillow

  # --- knn / graph backends ---
  - faiss           # or faiss-gpu if you want GPU FAISS in conda
  - pynndescent

  # --- Louvain ecosystem ---
  - python-igraph
  - louvain

  # --- tools ---
  - pip
